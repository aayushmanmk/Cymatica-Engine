<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYMATICA | Generative Audio Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            user-select: none; /* Prevent text selection while dragging */
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui {
            position: absolute;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            transition: opacity 0.8s ease;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: 15px;
            background: linear-gradient(90deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        p {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #aaa;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .btn-container {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 204, 0.5);
            color: #00ffcc;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .btn:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            letter-spacing: 6px;
        }

        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .hud-line {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            border-left: 2px solid #00ffcc;
            padding-left: 10px;
        }

        .active-track {
            color: #fff;
            text-shadow: 0 0 10px #00ffcc;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* --- CONTROL DECK STYLES --- */
        #control-deck {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 600px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; /* Hidden until music starts */
            transition: opacity 1s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #control-deck.collapsed {
            transform: translateX(-50%) translateY(70px);
        }

        .deck-header {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
        }

        #collapse-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffcc;
            border-bottom: none;
            color: #00ffcc;
            font-family: 'Rajdhani', sans-serif;
            cursor: pointer;
            padding: 2px 20px;
            font-size: 0.8rem;
            border-radius: 10px 10px 0 0;
            transition: all 0.3s ease;
        }

        #collapse-btn:hover {
            background: rgba(0, 255, 204, 0.2);
        }

        .deck-body {
            width: 100%;
            background: rgba(0, 10, 20, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .play-btn {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }

        .seek-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Slider Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        /* Slider Thumb */
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00ffcc;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px; /* center thumb */
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Mozilla styling */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
        }
        input[type=range]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border: none;
            border-radius: 50%;
            background: #00ffcc;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="ui">
        <h1>Cymatica</h1>
        <p>Generative Audio Intelligence Engine</p>
        <div class="btn-container">
            <button class="btn">Initialize System / Upload Audio</button>
            <input type="file" id="audio-input" accept="audio/*">
        </div>
    </div>

    <div id="hud">
        <div class="hud-line active-track" id="track-name">SYSTEM STANDBY</div>
        <div class="hud-line" id="fps-counter">FPS: 0</div>
        <div class="hud-line">ENGINE: WEBGL 2.0</div>
        <div class="hud-line">POST-PROCESS: BLOOM + CHROMATIC</div>
    </div>

    <!-- NEW CONTROL DECK -->
    <div id="control-deck">
        <div class="deck-header">
            <button id="collapse-btn">▼ HIDE CONTROLS</button>
        </div>
        <div class="deck-body">
            <button class="play-btn" id="play-pause-btn">❚❚</button>
            <div class="seek-container">
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
                <input type="range" id="seekbar" min="0" value="0" step="0.1">
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Import Three.js and Post Processing from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- CONFIGURATION ---
        const CONFIG = {
            fftSize: 32768,
            smoothing: 0.8,
            bloomStrength: 0.8,
            bloomRadius: 0.7,
            bloomThreshold: 0,
            noiseSpeed: 0.2
        };

        // --- GLOBAL VARIABLES ---
        let audioContext, audioSource, analyser, dataArray, bufferLength;
        let renderer, scene, camera, composer;
        let uniforms; 
        let particles, particleGeo;
        let isAudioPlaying = false;
        let audioElement = null; // Store the HTML Audio Element globally
        const clock = new THREE.Clock();

        // --- DOM ELEMENTS FOR CONTROLS ---
        const controlDeck = document.getElementById('control-deck');
        const collapseBtn = document.getElementById('collapse-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const seekbar = document.getElementById('seekbar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const trackNameEl = document.getElementById('track-name');

        // --- SHADER CODE ---
        const vertexShader = `
            uniform float uTime;
            uniform float uBass;
            
            varying vec2 vUv;
            varying float vDisplacement;
            varying vec3 vNormal;

            // Classic Perlin Noise function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                float noiseVal = snoise(position + vec3(uTime * 0.5));
                float displacement = noiseVal * (uBass * 2.5);
                vDisplacement = displacement;
                vec3 newPosition = position + normal * displacement;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform float uHighs;
            varying float vDisplacement;
            varying vec3 vNormal;
            varying vec2 vUv;

            void main() {
                vec3 color = vec3(0.05, 0.0, 0.1);
                vec3 highlight = vec3(0.0, 1.0, 0.8);
                vec3 highColor = vec3(1.0, 0.0, 0.5);
                float intensity = smoothstep(-0.2, 1.0, vDisplacement);
                vec3 finalColor = mix(color, highlight, intensity);
                finalColor = mix(finalColor, highColor, uHighs * intensity);
                float glow = pow(0.8 - dot(vNormal, vec3(0, 0, 1.0)), 3.0);
                finalColor += vec3(0.0, 0.5, 1.0) * glow;
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- INIT ---
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            uniforms = {
                uTime: { value: 0.0 },
                uBass: { value: 0.0 },
                uHighs: { value: 0.0 }
            };

            const geometry = new THREE.IcosahedronGeometry(1.5, 20); 
            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                wireframe: true 
            });

            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            const coreGeo = new THREE.IcosahedronGeometry(0.8, 1);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            scene.add(core);

            const particlesCount = 2000;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 40;
            }

            particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.05,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = CONFIG.bloomThreshold;
            bloomPass.strength = CONFIG.bloomStrength;
            bloomPass.radius = CONFIG.bloomRadius;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            window.addEventListener('resize', onWindowResize, false);
        }

        // --- HELPER FUNCTIONS ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- AUDIO ENGINE & CONTROL LOGIC ---
        document.getElementById('audio-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // UI Transitions
            document.getElementById('ui').classList.add('fade-out');
            document.getElementById('hud').style.opacity = 1;
            controlDeck.style.opacity = 1; // Show Control Deck
            
            trackNameEl.innerText = "TRACK: " + file.name.toUpperCase();

            // Stop previous audio if exists
            if (audioElement) {
                audioElement.pause();
                audioElement.src = "";
            }

            // Init Audio
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioElement = new Audio();
            audioElement.src = URL.createObjectURL(file);
            audioElement.crossOrigin = "anonymous";
            
            await audioElement.play();
            isAudioPlaying = true;
            playPauseBtn.innerHTML = "❚❚"; // Pause icon

            // Set up Analyser
            audioSource = audioContext.createMediaElementSource(audioElement);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = CONFIG.fftSize;
            
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);

            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            // --- AUDIO EVENT LISTENERS ---
            
            // 1. Update Durations when metadata loads
            audioElement.addEventListener('loadedmetadata', () => {
                seekbar.max = audioElement.duration;
                totalDurationEl.innerText = formatTime(audioElement.duration);
            });

            // 2. Update Seekbar and Time while playing
            audioElement.addEventListener('timeupdate', () => {
                if (!isAudioPlaying) return; 
                // Only update slider value if user isn't currently dragging it could be added,
                // but standard HTML input handles this reasonably well.
                seekbar.value = audioElement.currentTime;
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
            });

            // 3. Handle Track End
            audioElement.addEventListener('ended', () => {
                isAudioPlaying = false;
                playPauseBtn.innerHTML = "▶"; // Play icon
                seekbar.value = 0;
            });

            animate();
        });

        // --- CONTROL BUTTON HANDLERS ---
        
        // Play / Pause Click
        playPauseBtn.addEventListener('click', () => {
            if (!audioElement) return;

            if (audioElement.paused) {
                audioElement.play();
                isAudioPlaying = true;
                playPauseBtn.innerHTML = "❚❚";
            } else {
                audioElement.pause();
                isAudioPlaying = false; // Stops visualizer reacting
                playPauseBtn.innerHTML = "▶";
            }
        });

        // Seekbar Change (Click or Drag)
        seekbar.addEventListener('input', () => {
            if (!audioElement) return;
            audioElement.currentTime = seekbar.value;
            currentTimeEl.innerText = formatTime(seekbar.value);
        });

        // Collapse / Expand Toggle
        let isCollapsed = false;
        collapseBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                controlDeck.classList.add('collapsed');
                collapseBtn.innerHTML = "▲ SHOW CONTROLS";
            } else {
                controlDeck.classList.remove('collapsed');
                collapseBtn.innerHTML = "▼ HIDE CONTROLS";
            }
        });

        function getFrequencyRangeValue(data, minHz, maxHz) {
            const nyquist = audioContext.sampleRate / 2;
            const lowIndex = Math.round(minHz / nyquist * bufferLength);
            const highIndex = Math.round(maxHz / nyquist * bufferLength);
            
            let total = 0;
            let count = 0;
            
            for (let i = lowIndex; i <= highIndex; i++) {
                total += data[i];
                count++;
            }
            return (total / count) / 255;
        }

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            uniforms.uTime.value = time;

            // Only react to audio data if playing AND not paused
            if (analyser && isAudioPlaying && !audioElement.paused) {
                analyser.getByteFrequencyData(dataArray);

                const bass = getFrequencyRangeValue(dataArray, 20, 150);
                const mids = getFrequencyRangeValue(dataArray, 150, 2000);
                const highs = getFrequencyRangeValue(dataArray, 2000, 15000);

                uniforms.uBass.value = THREE.MathUtils.lerp(uniforms.uBass.value, bass, 0.1);
                uniforms.uHighs.value = THREE.MathUtils.lerp(uniforms.uHighs.value, highs, 0.1);

                scene.rotation.y = time * 0.1 + (mids * 0.5);
                scene.rotation.z = time * 0.05;

                particles.rotation.y = -time * 0.05;
                
                if (bass > 0.6) {
                    particles.scale.setScalar(1 + bass * 0.2);
                } else {
                    particles.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
                }

                if (highs > 0.4) {
                    particles.material.color.setHSL(time * 0.5, 1.0, 0.5);
                } else {
                    particles.material.color.setHex(0x00ffff);
                }

                document.getElementById('fps-counter').innerText = "BASS_INTENSITY: " + bass.toFixed(2);
            } else {
                // Idle animation when paused
                uniforms.uBass.value = THREE.MathUtils.lerp(uniforms.uBass.value, 0, 0.05);
                uniforms.uHighs.value = THREE.MathUtils.lerp(uniforms.uHighs.value, 0, 0.05);
                scene.rotation.y = time * 0.05;
            }

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        init();

    </script>
</body>
</html>
