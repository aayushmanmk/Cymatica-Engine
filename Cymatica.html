<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYMATICA | Generative Audio Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui {
            position: absolute;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            transition: opacity 0.8s ease;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: 15px;
            background: linear-gradient(90deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        p {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #aaa;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .btn-container {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 204, 0.5);
            color: #00ffcc;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .btn:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            letter-spacing: 6px;
        }

        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .hud-line {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            border-left: 2px solid #00ffcc;
            padding-left: 10px;
        }

        .active-track {
            color: #fff;
            text-shadow: 0 0 10px #00ffcc;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Cymatica</h1>
        <p>Generative Audio Intelligence Engine</p>
        <div class="btn-container">
            <button class="btn">Initialize System / Upload Audio</button>
            <input type="file" id="audio-input" accept="audio/*">
        </div>
    </div>

    <div id="hud">
        <div class="hud-line active-track" id="track-name">SYSTEM STANDBY</div>
        <div class="hud-line" id="fps-counter">FPS: 0</div>
        <div class="hud-line">ENGINE: WEBGL 2.0</div>
        <div class="hud-line">POST-PROCESS: BLOOM + CHROMATIC</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Import Three.js and Post Processing from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { GlitchPass } from 'three/addons/postprocessing/GlitchPass.js';

        // --- CONFIGURATION ---
        const CONFIG = {
            fftSize: 32768,
            smoothing: 0.8,
            bloomStrength: 0.8,
            bloomRadius: 0.7,
            bloomThreshold: 0,
            noiseSpeed: 0.2
        };

        // --- GLOBAL VARIABLES ---
        let audioContext, audioSource, analyser, dataArray, bufferLength;
        let renderer, scene, camera, composer;
        let uniforms; // Shared GLSL variables
        let particles, particleGeo;
        let isAudioPlaying = false;
        const clock = new THREE.Clock();

        // --- SHADER CODE ---
        // Vertex Shader: Deforms the geometry based on noise and audio bass
        const vertexShader = `
            uniform float uTime;
            uniform float uBass;
            
            varying vec2 vUv;
            varying float vDisplacement;
            varying vec3 vNormal;

            // Classic Perlin Noise function (simplified for GLSL)
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                
                // Add noise to position based on time
                float noiseVal = snoise(position + vec3(uTime * 0.5));
                
                // Displace vertices along normal vector
                // uBass intensity drives the spike magnitude
                float displacement = noiseVal * (uBass * 2.5);
                
                vDisplacement = displacement;
                
                vec3 newPosition = position + normal * displacement;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        // Fragment Shader: Colors the mesh based on displacement intensity
        const fragmentShader = `
            uniform float uTime;
            uniform float uHighs;
            
            varying float vDisplacement;
            varying vec3 vNormal;
            varying vec2 vUv;

            void main() {
                // Base dark color
                vec3 color = vec3(0.05, 0.0, 0.1);
                
                // Highlight color (Cyan/Teal)
                vec3 highlight = vec3(0.0, 1.0, 0.8);
                
                // High frequency color (Hot Pink)
                vec3 highColor = vec3(1.0, 0.0, 0.5);

                // Mix based on displacement (peaks get brighter)
                float intensity = smoothstep(-0.2, 1.0, vDisplacement);
                
                vec3 finalColor = mix(color, highlight, intensity);
                
                // Add flashes based on high frequencies
                finalColor = mix(finalColor, highColor, uHighs * intensity);

                // Add a "wireframe" glow effect using math (fresnel-ish)
                float glow = pow(0.8 - dot(vNormal, vec3(0, 0, 1.0)), 3.0);
                finalColor += vec3(0.0, 0.5, 1.0) * glow;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- INIT ---
        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Shader Uniforms
            uniforms = {
                uTime: { value: 0.0 },
                uBass: { value: 0.0 },
                uHighs: { value: 0.0 }
            };

            // 1. The Core Geometric Entity (The "Brain")
            // Using Icosahedron with high detail for organic spiking
            const geometry = new THREE.IcosahedronGeometry(1.5, 20); 
            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                wireframe: true // Wireframe looks more "techy" and intricate
            });

            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // 2. Inner Core (Solid, glowing center)
            const coreGeo = new THREE.IcosahedronGeometry(0.8, 1);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            scene.add(core);

            // 3. Particle System (The "Starfield")
            const particlesCount = 2000;
            const posArray = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount * 3; i++) {
                // Spread particles in a large sphere
                posArray[i] = (Math.random() - 0.5) * 40;
            }

            particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.05,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // --- POST PROCESSING ---
            const renderScene = new RenderPass(scene, camera);

            // Unreal Bloom for that intense glow
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = CONFIG.bloomThreshold;
            bloomPass.strength = CONFIG.bloomStrength;
            bloomPass.radius = CONFIG.bloomRadius;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
        }

        // --- AUDIO ENGINE ---
        document.getElementById('audio-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('ui').classList.add('fade-out');
            document.getElementById('hud').style.opacity = 1;
            document.getElementById('track-name').innerText = "TRACK: " + file.name.toUpperCase();

            // Init Audio Context
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audio = new Audio();
            audio.src = URL.createObjectURL(file);
            await audio.play();
            isAudioPlaying = true;

            audioSource = audioContext.createMediaElementSource(audio);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = CONFIG.fftSize;
            
            // Connect nodes
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);

            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            animate();
        });

        function getFrequencyRangeValue(data, minHz, maxHz) {
            const nyquist = audioContext.sampleRate / 2;
            const lowIndex = Math.round(minHz / nyquist * bufferLength);
            const highIndex = Math.round(maxHz / nyquist * bufferLength);
            
            let total = 0;
            let count = 0;
            
            for (let i = lowIndex; i <= highIndex; i++) {
                total += data[i];
                count++;
            }
            
            // Return normalized value 0.0 - 1.0
            return (total / count) / 255;
        }

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            uniforms.uTime.value = time;

            if (isAudioPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);

                // 1. Separate Audio Channels
                // Bass (Kick/Drums): 20Hz - 150Hz
                const bass = getFrequencyRangeValue(dataArray, 20, 150);
                // Mids (Vocals/Synths): 150Hz - 2000Hz
                const mids = getFrequencyRangeValue(dataArray, 150, 2000);
                // Highs (Hi-hats/Air): 2000Hz - 15000Hz
                const highs = getFrequencyRangeValue(dataArray, 2000, 15000);

                // 2. Smoothly update uniforms (Lerp)
                // This prevents jitter and makes movements fluid
                uniforms.uBass.value = THREE.MathUtils.lerp(uniforms.uBass.value, bass, 0.1);
                uniforms.uHighs.value = THREE.MathUtils.lerp(uniforms.uHighs.value, highs, 0.1);

                // 3. React Core Sphere
                // Rotate based on general intensity
                scene.rotation.y = time * 0.1 + (mids * 0.5);
                scene.rotation.z = time * 0.05;

                // 4. React Particles
                // Rotate particle field opposite to core
                particles.rotation.y = -time * 0.05;
                
                // If loud bass, particles expand out
                if (bass > 0.6) {
                    particles.scale.setScalar(1 + bass * 0.2);
                } else {
                    particles.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
                }

                // If loud highs, particles change color
                if (highs > 0.4) {
                    particles.material.color.setHSL(time * 0.5, 1.0, 0.5);
                } else {
                    particles.material.color.setHex(0x00ffff);
                }

                document.getElementById('fps-counter').innerText = "BASS_INTENSITY: " + bass.toFixed(2);
            }

            // Render
            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize scene immediately
        init();

    </script>
</body>
</html>
